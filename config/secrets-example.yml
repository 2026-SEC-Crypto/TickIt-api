---
# COPY this file to secrets.yml and modify as needed
development:
  DATABASE_URL: sqlite://db/local/development.db
  ENCRYPTION_KEY: "dev-key-must-be-at-least-32-bytes-long!!"
  GOOGLE_CLIENT_ID: "<set-in-google-cloud>"
  GOOGLE_CLIENT_SECRET: "<set-in-google-cloud>"
  GOOGLE_JWKS_URI: "https://www.googleapis.com/oauth2/v3/certs"

test:
  DATABASE_URL: sqlite://db/local/test.db
  ENCRYPTION_KEY: "test-key-must-be-at-least-32-bytes-long!!"
  GOOGLE_CLIENT_ID: "<set-in-google-cloud>"
  GOOGLE_CLIENT_SECRET: "<set-in-google-cloud>"
  GOOGLE_JWKS_URI: "https://www.googleapis.com/oauth2/v3/certs"

production:
  DATABASE_URL: <do not set - assigned by production service>
  ENCRYPTION_KEY: <MUST be set in production environment - use strong key>
  GOOGLE_CLIENT_ID: <MUST be set in production environment>
  GOOGLE_CLIENT_SECRET: <MUST be set in production environment>
  GOOGLE_JWKS_URI: "https://www.googleapis.com/oauth2/v3/certs"
